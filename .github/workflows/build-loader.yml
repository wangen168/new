name: build-loader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 1) 写入 loader.m
        run: |
          python3 -c 'import base64,pathlib;pathlib.Path("loader.m").write_bytes(base64.b64decode(""))'
          echo "loader.m bytes: $(wc -c < loader.m)"
          grep -c "grab_kernelcache" loader.m || true
          grep -c "keychain prepare" loader.m || true

      - name: 2) 编译 arm64e
        run: |
          set -e
          xcrun -sdk iphoneos clang -arch arm64e -dynamiclib -fobjc-arc -O2 \
            -Wall -Wno-unused-variable -Wno-format \
            -miphoneos-version-min=15.0 -framework Foundation \
            -install_name @rpath/libloaderinject.dylib \
            -o libloaderinject.dylib loader.m
          echo "arch: $(lipo -archs libloaderinject.dylib)"
          ls -l libloaderinject.dylib

      - name: 3) 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: libloaderinject
          path: libloaderinject.dylib
