name: build-loader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 1) 写入 loader.m（自带源码，无需上传）
        run: |
          python3 -c 'import base64,pathlib;pathlib.Path("loader.m").write_bytes(base64.b64decode(""))'
          echo "loader.m 字节数: $(wc -c < loader.m)"
          head -2 loader.m

      - name: 2) 工具链诊断
        run: |
          xcodebuild -version || true
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path || echo 缺失)"
          which clang || true

      - name: 3) 编译（arm64e 优先，失败自动回退 arm64）
        run: |
          set -e
          ok=0
          if xcrun -sdk iphoneos clang -arch arm64e -dynamiclib -fobjc-arc -O2 \
               -miphoneos-version-min=15.0 -framework Foundation \
               -install_name @rpath/libloaderinject.dylib \
               -o libloaderinject.dylib loader.m 2> arm64e.err; then
            echo "== arm64e 编译成功 =="; ok=1
          else
            echo "== arm64e 失败，日志如下 =="; cat arm64e.err
            echo "== 回退 arm64 =="
            xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -O2 \
              -miphoneos-version-min=15.0 -framework Foundation \
              -install_name @rpath/libloaderinject.dylib \
              -o libloaderinject.dylib loader.m
            echo "== arm64 编译成功（能被 arm64e 进程加载）=="; ok=1
          fi
          test "$ok" = "1"
          echo "产物信息:"; lipo -info libloaderinject.dylib; ls -l libloaderinject.dylib

      - name: 4) 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libloaderinject
          path: |
            libloaderinject.dylib
            arm64e.err
          if-no-files-found: warn
