name: build-loader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 编译 arm64e loader
        run: |
          set -e
          xcrun -sdk iphoneos clang \
            -arch arm64e -dynamiclib -fobjc-arc -O2 \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            -install_name @rpath/libloaderinject.dylib \
            -o libloaderinject.dylib loader.m
          echo "架构: $(lipo -archs libloaderinject.dylib)"
          ls -l libloaderinject.dylib

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: libloaderinject
          path: libloaderinject.dylib
