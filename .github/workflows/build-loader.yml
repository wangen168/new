name: build-loader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 1) 写入 loader.m（自带源码，无需上传）
        run: |
          python3 -c 'import base64,pathlib;pathlib.Path("loader.m").write_bytes(base64.b64decode(""))'
          echo "loader.m bytes: $(wc -c < loader.m)"
          if grep -q "^#import <sys/ptrace.h>" loader.m; then echo "ERROR: sys/ptrace.h present"; else echo "OK: no sys/ptrace.h"; fi
          grep -n "fn3i_t pIsReady" loader.m || true

      - name: 2) 工具链诊断
        run: |
          xcodebuild -version || true
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path || echo missing)"

      - name: 3) 编译（arm64e 优先，失败回退 arm64）
        run: |
          set -e
          if xcrun -sdk iphoneos clang -arch arm64e -dynamiclib -fobjc-arc -O2 \
               -miphoneos-version-min=15.0 -framework Foundation \
               -install_name @rpath/libloaderinject.dylib \
               -o libloaderinject.dylib loader.m 2> arm64e.err; then
            echo "== arm64e OK =="
          else
            echo "== arm64e failed =="; cat arm64e.err
            echo "== fallback arm64 =="
            xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -O2 \
              -miphoneos-version-min=15.0 -framework Foundation \
              -install_name @rpath/libloaderinject.dylib \
              -o libloaderinject.dylib loader.m
            echo "== arm64 OK =="
          fi
          lipo -info libloaderinject.dylib
          ls -l libloaderinject.dylib

      - name: 4) 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libloaderinject
          path: |
            libloaderinject.dylib
            arm64e.err
          if-no-files-found: warn
